# Signum timing calibration. Copy to ~/.config/signum/calibration.conf
# (or $XDG_CONFIG_HOME/signum/calibration.conf), or name it with --cal FILE.
# Lines are "key = number"; everything else is ignored. Without a file (or
# for the keys it leaves out) the modem calibrates itself and keeps what it
# measured in ~/.config/signum/autocal-DEV.conf (--no-autocal: off). A value
# given here always wins. Values below are examples only: measure your own audio path.

# The audio path's round-trip calibration, in seconds: callee replies leave
# this much earlier.
#rt_latency_s = 0.0
# Fine adjustment of the reply time, in seconds.
#reply_adjust_s = 0.0
# The sound card's own latency, in seconds (used for self-timing).
#hw_latency_s = 0.0
# The sound card's sample-rate error in parts per million (--audio-ppm or the
# AUDIO_PPM environment variable override it).
#audio_ppm = 0.0
